name: Build and deploy to GitHub Pages

# Regenerates static/exercises.json and static/version.json from exercises/*.json
# on every push to main, so editing an exercise file is all it takes to publish.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and generate
        run: python gen_full_exercises.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r static exercises _site/
          if [ -d images ]; then cp -r images _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
