name: Validate exercises

on:
  pull_request:
  push:
    branches-ignore: [main] # main is validated by the deploy workflow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gen_full_exercises.py --validate
